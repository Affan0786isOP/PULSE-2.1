# PULSE Research Platform - Stage 0 Data Map
# Comprehensive data inventory, access control, retention, and lawful basis

version: "1.0.0"
last_audited: "2026-09-20"
platform: "PULSE Cognitive Assessment System"
governance_model: "Zero-Email Anonymous Participant Architecture"

entities:
  - collection: "experimentSessions"
    description: "Ephemeral server-issued experiment session tokens and state bindings"
    pii_classification: "Pseudonymous (no email, no IP, synthetic random session UID)"
    fields:
      - name: "sessionId"
        type: "string (UUIDv4)"
        classification: "Internal session token"
      - name: "uid"
        type: "string (Firebase Auth UID)"
        classification: "Anonymous participant UID"
      - name: "assessmentType"
        type: "string"
        classification: "Protocol identifier"
      - name: "ageGroup"
        type: "string"
        classification: "Normative cohort (e.g., Adults (26–40))"
      - name: "createdAt"
        type: "number (epoch ms)"
        classification: "Timestamp"
      - name: "expiresAt"
        type: "number (epoch ms)"
        classification: "Timestamp (session expiry)"
      - name: "consumed"
        type: "boolean"
        classification: "Replay prevention flag"
      - name: "derivedMetrics"
        type: "object"
        classification: "Derived cognitive outcomes"
    readers:
      - "Server Authoritative Backend (API)"
      - "Subject Owner (request.auth.uid == resource.data.uid)"
    writers:
      - "Server Authoritative Backend only"
    retention:
      period: "90 days"
      deletion_trigger: "Automatic expiry or manual subject purge request"
    lawful_basis: "Consent (Research Protocol) & Legitimate Interest (Fraud Prevention)"

  - collection: "assessmentResults"
    description: "Validated aggregate cognitive assessment records"
    pii_classification: "Pseudonymous"
    fields:
      - name: "participantId"
        type: "string"
        classification: "Anonymous participant UID"
      - name: "sessionId"
        type: "string"
        classification: "Experiment session ID"
      - name: "assessmentType"
        type: "string"
        classification: "Protocol type"
      - name: "ageGroup"
        type: "string"
        classification: "Age cohort"
      - name: "completedAtMonth"
        type: "string (YYYY-MM)"
        classification: "Coarse temporal aggregation"
      - name: "derivedMetrics"
        type: "object"
        classification: "Reaction times, accuracy, interference cost, memory spans"
      - name: "provenanceToken"
        type: "string (HMAC-SHA256)"
        classification: "Cryptographic tamper-evidence proof"
      - name: "trialsDigest"
        type: "string (SHA256)"
        classification: "Complete trial sequence digest"
    readers:
      - "Subject Owner (request.auth.uid == resource.data.participantId)"
      - "Server Authoritative Backend"
    writers:
      - "Server Authoritative Backend only (client write denied)"
    retention:
      period: "5 years"
      deletion_trigger: "Subject GDPR/CCPA erasure request"
    lawful_basis: "Scientific Research Consent (Art. 6(1)(a) & Art. 89 GDPR)"

  - collection: "assessmentTrials"
    description: "Granular trial-by-trial millisecond reaction telemetry"
    pii_classification: "Pseudonymous high-resolution telemetry"
    fields:
      - name: "participantId"
        type: "string"
        classification: "Anonymous participant UID"
      - name: "experimentId"
        type: "string"
        classification: "Linked experiment session"
      - name: "test"
        type: "string"
        classification: "Assessment type"
      - name: "trialNumber"
        type: "number"
        classification: "Trial sequence index"
      - name: "stimulusTimestamp"
        type: "number"
        classification: "Stimulus presentation performance mark"
      - name: "responseTimestamp"
        type: "number"
        classification: "Response detection performance mark"
      - name: "reactionTime"
        type: "number"
        classification: "Reaction latency (ms)"
      - name: "rawLatencyMs"
        type: "number"
        classification: "Uncorrected raw hardware latency (ms)"
      - name: "accuracy"
        type: "number (0 or 1)"
        classification: "Correctness metric"
      - name: "falseStart"
        type: "boolean"
        classification: "Anticipatory reaction flag"
      - name: "timedOut"
        type: "boolean"
        classification: "Timeout flag"
      - name: "valid"
        type: "boolean"
        classification: "Physiological validity flag"
      - name: "deviceCategory"
        type: "string (mobile | desktop)"
        classification: "Hardware category"
    readers:
      - "Subject Owner (request.auth.uid == resource.data.participantId)"
      - "Server Authoritative Backend"
    writers:
      - "Server Authoritative Backend only (client write denied)"
    retention:
      period: "5 years"
      deletion_trigger: "Subject GDPR/CCPA erasure request"
    lawful_basis: "Scientific Research Consent"

  - collection: "publicDataset"
    description: "Anonymized, publicly downloadable open research benchmark data"
    pii_classification: "Anonymized (Zero PII, zero UIDs, zero IP addresses)"
    fields:
      - name: "assessmentType"
        type: "string"
        classification: "Protocol"
      - name: "ageGroup"
        type: "string"
        classification: "Cohort"
      - name: "completedAtMonth"
        type: "string (YYYY-MM)"
        classification: "Coarse month"
      - name: "deviceCategory"
        type: "string"
        classification: "Form factor"
      - name: "progressionTrials"
        type: "array"
        classification: "Sanitized trial latencies & accuracy (no session/user ID)"
      - name: "derivedMetrics"
        type: "object"
        classification: "Standard cognitive metrics"
      - name: "provenanceToken"
        type: "string"
        classification: "Server HMAC token"
      - name: "trialsDigest"
        type: "string"
        classification: "Sequence digest"
    readers:
      - "Public (Unrestricted open scientific read access)"
    writers:
      - "Server Authoritative Backend only"
    retention:
      period: "Indefinite"
      deletion_trigger: "Open scientific archive preservation"
    lawful_basis: "Legitimate Interest (Open Science & Reproducible Research)"

  - collection: "leaderboardResults"
    description: "Opt-in competitive rankings"
    pii_classification: "Pseudonymous alias (opt-in self-declared alias)"
    fields:
      - name: "displayName"
        type: "string"
        classification: "User-chosen public alias (profanity sanitized)"
      - name: "assessmentType"
        type: "string"
        classification: "Protocol"
      - name: "scoreMetric"
        type: "number"
        classification: "Primary score (ms or sequence length)"
      - name: "ageGroup"
        type: "string"
        classification: "Cohort"
      - name: "createdAt"
        type: "number (epoch ms)"
        classification: "Submission timestamp"
      - name: "provenanceToken"
        type: "string"
        classification: "HMAC token verifying validity"
      - name: "hidden"
        type: "boolean"
        classification: "Moderator visibility flag"
      - name: "hideReason"
        type: "string"
        classification: "Moderation rationale"
    readers:
      - "Public (where hidden != true)"
      - "Admin Console (via Server Authoritative API)"
    writers:
      - "Server Authoritative Backend only"
    retention:
      period: "2 years"
      deletion_trigger: "User request or administrator moderation action"
    lawful_basis: "Explicit Consent (Voluntary Leaderboard Opt-In)"

  - collection: "adminAuditLogs"
    description: "Cryptographically bound administrative moderation audit trail"
    pii_classification: "Administrative operations audit"
    fields:
      - name: "actor"
        type: "string"
        classification: "Admin actor ('admin')"
      - name: "action"
        type: "string"
        classification: "Action code (HIDE_LEADERBOARD_ENTRY, DELETE_LEADERBOARD_ENTRY)"
      - name: "target"
        type: "string"
        classification: "Target document UUID"
      - name: "timestamp"
        type: "number | string"
        classification: "Server timestamp"
      - name: "note"
        type: "string"
        classification: "Moderator rationale / notes"
    readers:
      - "Server Authoritative Admin API only (client read strictly denied)"
    writers:
      - "Server Authoritative Backend only"
    retention:
      period: "7 years"
      deletion_trigger: "Statutory compliance audit requirement"
    lawful_basis: "Legal Obligation & Legitimate Interest (Security & Integrity)"
