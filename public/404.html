<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0B0D10" />
    <title>Page Not Found | PULSE</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0d10; color: #f4f7fa; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; box-sizing: border-box; background: #0b0d10; }
      main { width: min(100%, 40rem); border: 1px solid #27313a; border-radius: 1rem; padding: 2rem; text-align: center; background: #10151b; }
      h1 { margin: 0 0 .5rem; font-size: 3rem; }
      p { color: #91a5b5; line-height: 1.6; }
      nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; margin-top: 1.5rem; }
      a { color: #22c7d6; text-decoration: none; padding: .55rem .8rem; border: 1px solid #27313a; border-radius: .65rem; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <p aria-label="PULSE">PULSE</p>
      <h1>404</h1>
      <p>The page you requested does not exist.</p>
      <nav aria-label="Useful PULSE pages">
        <a href="/">Home</a>
        <a href="/assessments">Assessments</a>
        <a href="/leaderboard">Leaderboard</a>
        <a href="/improve">Performance Guide</a>
      </nav>
    </main>
  </body>
</html>
