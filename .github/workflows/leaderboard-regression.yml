name: Leaderboard regression checks

on:
  push:
    branches:
      - main
      - CLAUDE-GPT-BUG-FIXES
  pull_request:
    branches:
      - main
    paths:
      - 'src/components/Leaderboard*'
      - 'mobile/src/components/Leaderboard*'
      - 'src/components/LeaderboardOptIn.tsx'
      - 'mobile/src/components/LeaderboardOptIn.tsx'
      - 'src/components/ui/AssessmentHero3D.tsx'
      - 'tests/unit/assessmentHeroKeyboard.test.tsx'
      - 'src/components/admin/LeaderboardModeration.tsx'
      - 'server/**'
      - 'shared/domain/leaderboard*'
      - 'src/lib/firestore.ts'
      - 'mobile/src/lib/firestore.ts'
      - 'src/lib/adminActions.ts'
      - 'tests/unit/leaderboard*'
      - 'tests/unit/**'
      - 'tests/unit/firebase.test.ts'
      - 'tests/unit/firestore.test.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: leaderboard-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Report npm audit findings (non-blocking)
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); const v=Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,direct:x.isDirect,range:x.range,fixAvailable:x.fixAvailable,advisories:(x.via||[]).filter(y=>typeof y==='object').map(y=>({title:y.title,url:y.url,range:y.range}))})); console.log('npm audit vulnerable packages:',v.length); console.log(JSON.stringify(v,null,2));"

      - name: Typecheck desktop and mobile
        run: npm run check

      - name: Run full unit test suite
        run: npm test
