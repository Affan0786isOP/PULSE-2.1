name: Typography completion verification

on:
  push:
    branches:
      - chore/finish-typography-assets
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/typography-completion.yml'
      - 'scripts/og-templates/**'
      - 'scripts/generate-og-images.mjs'
      - 'src/brand/tokens.css'
      - 'src/brand/tokens.json'
      - 'src/index.css'
      - 'mobile/src/index.css'
      - 'index.html'
      - 'mobile/index.html'
      - 'src/components/Dataset.tsx'
      - 'mobile/src/components/Dataset.tsx'
      - 'src/components/DirectionDataset.tsx'
      - 'mobile/src/components/DirectionDataset.tsx'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

concurrency:
  group: typography-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, regenerate OG cards, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for OG rendering
        run: npx playwright install --with-deps chromium

      - name: Typecheck desktop and mobile
        run: npm run check

      - name: Regenerate 1200x630 OG social cards
        run: node scripts/generate-og-images.mjs

      - name: Verify generated OG cards and service-worker font cache
        run: npx vitest run tests/unit/ogImages.test.ts tests/unit/serviceWorkerCache.test.ts

      - name: Run complete unit test suite
        run: npm test

      - name: Build desktop, mobile, SEO pages, and server bundle
        run: npm run build

      - name: Upload regenerated OG image files
        uses: actions/upload-artifact@v4
        with:
          name: pulse-typography-og-images
          path: |
            public/og-guides-reaction.png
            public/og-guides-stroop.png
            public/og-benchmarks.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit regenerated OG cards to the source branch
        if: github.event_name == 'pull_request'
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/og-guides-reaction.png public/og-guides-stroop.png public/og-benchmarks.png
          if git diff --cached --quiet; then
            echo 'OG images already match the generated output.'
            exit 0
          fi
          git commit -m 'chore(typography): regenerate OG social cards'
          git push origin "HEAD:${SOURCE_BRANCH}"
