<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030508" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PULSE" />
    <meta name="application-name" content="PULSE" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/mobile/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/mobile/favicon.svg" />
    <link rel="apple-touch-icon" href="/mobile/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/mobile/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/mobile/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <title>PULSE Evaluator Mobile</title>
    <meta name="description" content="Precision User Latency and Stimulus Evaluator" />
    <meta property="og:title" content="PULSE Evaluator Mobile" />
    <meta property="og:description" content="Precision User Latency and Stimulus Evaluator" />
    <script>
      (function() {
        // Register Service Worker for PWA Add-to-Home-Screen support
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/mobile/sw.js').catch(function(err) {
              console.log('SW registration note:', err);
            });
          });
        }

        // Instant Settings & Theme Application
        function applySavedSettings() {
          try {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');

            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute('content', '#030508');
            }

            var raw = localStorage.getItem('pulse_user_settings');
            var settings = raw ? JSON.parse(raw) : null;
            var prefersReduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var isReducedMotion = settings && typeof settings.reducedMotionEnabled === 'boolean' ? settings.reducedMotionEnabled : prefersReduce;

            if (isReducedMotion) {
              document.documentElement.setAttribute('data-reduced-motion', 'true');
              document.documentElement.classList.add('reduced-motion');
            } else {
              document.documentElement.removeAttribute('data-reduced-motion');
              document.documentElement.classList.remove('reduced-motion');
            }

            if (settings && settings.exhibitionModeEnabled) {
              document.documentElement.setAttribute('data-exhibition-mode', 'true');
              document.documentElement.classList.add('exhibition-mode');
            }

            if (settings && typeof settings.fontScale === 'number' && settings.fontScale >= 0.7 && settings.fontScale <= 1.5) {
              document.documentElement.style.setProperty('--font-size', Math.round(settings.fontScale * 100) + '%');
              document.documentElement.style.setProperty('--font-scale', settings.fontScale);
              document.documentElement.setAttribute('data-font-scale', settings.fontScale);
            }
          } catch(e) {}
        }

        applySavedSettings();
      })();
    </script>
    <style>
      html, body {
        background-color: var(--bg-base, #030508);
        color: var(--text-main, #ffffff);
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body class="bg-[var(--bg-base)] text-[var(--text-main)] antialiased selection:bg-cyan-500/30">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
