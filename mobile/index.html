    <title>PULSE Mobile | Precision Latency &amp; Stimulus Evaluator</title>
    <meta name="description" content="Empirical cognitive assessment platform measuring visual reaction latency, choice discrimination, and spatial working memory on mobile devices." />
    <meta property="og:title" content="PULSE Mobile | Precision Latency &amp; Stimulus Evaluator" />
    <meta property="og:description" content="Empirical cognitive assessment platform measuring visual reaction latency, choice discrimination, and spatial working memory on mobile devices." />

    <meta name="twitter:title" content="PULSE Mobile | Precision Latency &amp; Stimulus Evaluator" />
    <meta name="twitter:description" content="Empirical cognitive assessment platform measuring visual reaction latency, choice discrimination, and spatial working memory on mobile devices." />
    <meta name="twitter:image" content="https://pulse-lab.in/og-image.png" />
    <link rel="canonical" href="https://pulse-lab.in" />
    <script>
      (function() {
        // Symmetrical First-Paint Desktop Auto-Redirection
        try {
          var search = window.location.search || '';
          var params = new URLSearchParams(search);

          function isTruthy(val) {
            if (!val) return false;
            var v = String(val).toLowerCase().trim();
            return v === '1' || v === 'true' || v === 'yes';
          }

          var hasMobileParam = isTruthy(params.get('force_mobile')) || isTruthy(params.get('mobile'));
          var hasDesktopParam = isTruthy(params.get('force_desktop')) || isTruthy(params.get('desktop'));

          var storedDesktop = false;
          var storedMobile = false;
          try {
            storedDesktop = sessionStorage.getItem('pulse_force_desktop') === 'true';
            storedMobile = sessionStorage.getItem('pulse_force_mobile') === 'true';
          } catch(e) {}

          var cookieStr = document.cookie || '';
          var cookieDesktop = cookieStr.indexOf('pulse_force_desktop=true') !== -1 || cookieStr.indexOf('pulse_force_desktop=1') !== -1;
          var cookieMobile = cookieStr.indexOf('pulse_force_mobile=true') !== -1 || cookieStr.indexOf('pulse_force_mobile=1') !== -1;

          if (hasMobileParam) {
            try {
              sessionStorage.removeItem('pulse_force_desktop');
              sessionStorage.setItem('pulse_force_mobile', 'true');
              document.cookie = "pulse_force_desktop=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
              document.cookie = "pulse_force_mobile=true; path=/; max-age=86400; SameSite=Lax";
            } catch(e) {}
            storedDesktop = false;
            storedMobile = true;
          } else if (hasDesktopParam) {
            try {
              sessionStorage.removeItem('pulse_force_mobile');
              sessionStorage.setItem('pulse_force_desktop', 'true');
              document.cookie = "pulse_force_mobile=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
              document.cookie = "pulse_force_desktop=true; path=/; max-age=86400; SameSite=Lax";
            } catch(e) {}
            storedDesktop = true;
            storedMobile = false;
          }

          var isExplicitForceMobile = hasMobileParam || (!hasDesktopParam && (storedMobile || cookieMobile));
          var isExplicitForceDesktop = !isExplicitForceMobile && (hasDesktopParam || storedDesktop || cookieDesktop);

          var inIframe = false;
          try {
            inIframe = window.self !== window.top;
          } catch(e) {
            inIframe = true;
          }

          var ua = navigator.userAgent || navigator.vendor || window.opera || '';
          var isMobileUA = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|Silk|Kindle|KFAPWI|Fennec|Windows Phone|SamsungBrowser|MiuiBrowser|UCBrowser/i.test(ua);
          var maxTouch = (navigator.maxTouchPoints || 0);
          var hasTouch = ('ontouchstart' in window) || maxTouch > 0;
          var screenW = window.screen ? Math.min(window.screen.width, window.screen.height) : 0;
          var isSmallPhysicalScreen = screenW > 0 && screenW <= 768;
          var isMobileDevice = isMobileUA || (hasTouch && isSmallPhysicalScreen);

          if (!inIframe && (isExplicitForceDesktop || (!isExplicitForceMobile && !isMobileDevice))) {
            var pathname = window.location.pathname || '';
            var cleanPath = pathname.replace(/^\/mobile\/?/, '/');
            var targetPath = (cleanPath === '' ? '/' : cleanPath) + search + (window.location.hash || '');
            window.location.replace(targetPath);
            return;
          }
        } catch(e) {}
        // Register Service Worker for PWA Add-to-Home-Screen support
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/mobile/sw.js').catch(function(err) {
              console.log('SW registration note:', err);
            });
          });
        }

        // Instant Settings & Theme Application
        function applySavedSettings() {
          try {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');

            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute('content', '#030508');
            }

            var raw = localStorage.getItem('pulse_user_settings');
            var settings = raw ? JSON.parse(raw) : null;
            var prefersReduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var isReducedMotion = settings && typeof settings.reducedMotionEnabled === 'boolean' ? settings.reducedMotionEnabled : prefersReduce;

            if (isReducedMotion) {
              document.documentElement.setAttribute('data-reduced-motion', 'true');
              document.documentElement.classList.add('reduced-motion');
            } else {
              document.documentElement.removeAttribute('data-reduced-motion');
              document.documentElement.classList.remove('reduced-motion');
            }

            if (settings && settings.exhibitionModeEnabled) {
              document.documentElement.setAttribute('data-exhibition-mode', 'true');
              document.documentElement.classList.add('exhibition-mode');
            }

            if (settings && typeof settings.fontScale === 'number' && settings.fontScale >= 0.7 && settings.fontScale <= 1.5) {
              document.documentElement.style.setProperty('--font-size', Math.round(settings.fontScale * 100) + '%');
              document.documentElement.style.setProperty('--font-scale', settings.fontScale);
              document.documentElement.setAttribute('data-font-scale', settings.fontScale);
            }
          } catch(e) {}
        }

        applySavedSettings();
      })();
    </script>
