<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030508" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PULSE" />
    <meta name="application-name" content="PULSE" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/mobile/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/mobile/favicon.svg" />
    <link rel="apple-touch-icon" href="/mobile/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mobile/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/mobile/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/mobile/icon-512.png" />
    <title>PULSE Evaluator Mobile</title>
    <meta name="description" content="Precision User Latency and Stimulus Evaluator" />
    <meta property="og:title" content="PULSE Evaluator Mobile" />
    <meta property="og:description" content="Precision User Latency and Stimulus Evaluator" />
    <script>
      (function() {
        // Register Service Worker for PWA Add-to-Home-Screen support
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/mobile/sw.js').catch(function(err) {
              console.log('SW registration note:', err);
            });
          });
        }

        // Instant Settings & Theme Application
        function applySavedSettings() {
          try {
            var raw = localStorage.getItem('pulse_user_settings');
            var settings = raw ? JSON.parse(raw) : null;
            var themeMode = (settings && settings.themeMode) || 'system';
            var isDark = themeMode === 'dark' ? true : (themeMode === 'light' ? false : (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches));
            var theme = isDark ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            document.documentElement.style.colorScheme = theme;
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            } else {
              document.documentElement.classList.add('light');
              document.documentElement.classList.remove('dark');
            }
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) {
              meta.setAttribute('content', isDark ? '#030508' : '#f1f5f9');
            }
            if (settings && settings.reducedMotionEnabled) {
              document.documentElement.setAttribute('data-reduced-motion', 'true');
              document.documentElement.classList.add('reduced-motion');
            }
            if (settings && settings.exhibitionModeEnabled) {
              document.documentElement.setAttribute('data-exhibition-mode', 'true');
              document.documentElement.classList.add('exhibition-mode');
            }
          } catch(e) {}
        }

        applySavedSettings();
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
            try {
              var raw = localStorage.getItem('pulse_user_settings');
              var settings = raw ? JSON.parse(raw) : null;
              if (!settings || settings.themeMode === 'system') {
                applySavedSettings();
              }
            } catch(e) {}
          });
        }
      })();
    </script>
    <style>
      html, body {
        background-color: var(--bg-base, #030508);
        color: var(--text-main, #ffffff);
        margin: 0;
        padding: 0;
        min-height: 100%;
        width: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-tap-highlight-color: transparent;
        -webkit-overflow-scrolling: touch;
      }
      #root {
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body class="bg-[var(--bg-base)] text-[var(--text-main)] antialiased selection:bg-cyan-500/30">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
