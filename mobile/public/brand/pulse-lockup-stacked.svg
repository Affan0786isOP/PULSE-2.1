<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" fill="none" width="100%" height="100%">
  <!-- Background Plate -->
  <rect width="240" height="190" rx="8" fill="#08080A" />
  
  <!-- PULSE P-Symbol Centered -->
  <g transform="translate(80, 22) scale(0.8)">
    <!-- S1: Upper Loop -->
    <path d="M 12 8 L 61 8 C 75.9 8 88 20.1 88 35 C 88 49.9 75.9 62 61 62 L 46 62 L 46 45 L 61 45 C 66.5 45 71 40.5 71 35 C 71 29.5 66.5 25 61 25 L 12 25 Z" fill="#00F0FF" />
    <!-- S2: Lower Slanted Stem -->
    <path d="M 12 55 L 36 38 L 36 75 L 12 92 Z" fill="#00F0FF" />
  </g>

  <!-- Wordmark 'P U L S E' Centered -->
