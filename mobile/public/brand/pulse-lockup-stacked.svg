        font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" 
        font-weight="700" 
        font-size="24" 
        letter-spacing="0.32em">PULSE</text>

  <!-- Telemetry Subtitle -->
  <text x="120" y="156" 
        text-anchor="middle" 
        fill="#7E808C" 
        font-family="'JetBrains Mono', 'SF Mono', monospace" 
